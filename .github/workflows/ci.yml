# CI for marine_sonar_widgets. See ADR-0004/0005 (enforcement hierarchy) in the
# workspace repo for the rationale behind the build+test+lint gate. The library
# depends on Qt5, marine_colormap (source sibling), marine_acoustic_msgs
# (resolves via rosdep), and marine_interfaces (contact_builder's Contact.msg, a
# package inside unh_marine_autonomy). marine_colormap and marine_interfaces are
# not published to rosdep, so they are cloned as source siblings the way
# marine_perception_tools CI does. rqt_operator_tools is a consumer of this
# library, not a dependency, so it is not cloned here.

name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ros:jazzy-ros-core

    steps:
      - name: Update apt
        run: apt-get update

      - name: Install ros dev tools
        run: DEBIAN_FRONTEND=noninteractive apt-get -y install ros-dev-tools

      - name: Checkout
        uses: actions/checkout@v6

      - name: Init rosdep
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi

      - name: Update rosdep
        run: rosdep update

      - name: Create workspace
        run: mkdir -p ../ws/src && ln -s "$GITHUB_WORKSPACE" ../ws/src/marine_sonar_widgets

      # marine_colormap is a source sibling (not in rosdep): the shared sonar
      # widgets use its colormap library/shaders. Clone it so the build resolves.
      # marine_acoustic_msgs resolves via rosdep.
      - name: Clone marine_colormap source dependency
        run: >
          git clone --depth 1 -b jazzy
          https://github.com/rolker/marine_colormap.git
          ../ws/src/marine_colormap

      # marine_interfaces (Contact.msg, used by contact_builder) is a package
      # inside the unh_marine_autonomy repo, not published to rosdep. Clone the
      # repo and keep only that package so CI doesn't pull the heavy transitive
      # deps of its sibling packages (mirrors marine_perception_tools CI).
      - name: Clone marine_interfaces source dependency
        run: |
          git clone --depth 1 -b jazzy \
            https://github.com/rolker/unh_marine_autonomy.git /tmp/uma
          mv /tmp/uma/marine_interfaces ../ws/src/marine_interfaces

      - name: Install ROS dependencies
        working-directory: ../ws
        run: >
          DEBIAN_FRONTEND=noninteractive
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          colcon build --packages-up-to marine_sonar_widgets
          --cmake-args -DBUILD_TESTING=ON'

      - name: Test
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          source install/setup.bash &&
          colcon test --packages-select marine_sonar_widgets
          --event-handlers console_direct+
          --return-code-on-test-failure'

      - name: Test results
        working-directory: ../ws
        run: >
          bash -c 'source /opt/ros/jazzy/setup.bash &&
          colcon test-result --verbose'
        if: always()
